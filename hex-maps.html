<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マップ編集｜朧 OBORO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hex-common.css">
<style>
.bar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:.6rem 1.25rem;display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.status{font-size:.85rem;color:var(--muted);margin-left:.4rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:1rem;max-width:1200px;margin:0 auto;padding:1rem 1.25rem 2rem}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{display:flex;flex-direction:column;gap:.8rem}
.board-wrap{align-self:start;background:var(--map);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
svg#board{display:block;width:100%;height:auto;min-width:600px;touch-action:none;user-select:none}
.tile{pointer-events:none}
.rv{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.rv-bank{stroke:#7A7461}.rv-water{stroke:#3590D6}.rv-shine{stroke:#7CCBF5;opacity:.9}
.cell{fill:transparent;stroke:var(--ink);stroke-opacity:.18;stroke-width:1;cursor:crosshair}
.cell.zone-blue{fill:var(--arc-blue);fill-opacity:.35}.cell.zone-red{fill:var(--arc-red);fill-opacity:.35}
.m-zones .cell.zone-blue,.m-zones .cell.zone-red{fill-opacity:1}
.cell:hover{stroke-opacity:.9;stroke-width:2}
.cell.drop{stroke-opacity:1;stroke-width:3;stroke-dasharray:4 3}
.readonly .cell{cursor:not-allowed}
.unit{pointer-events:none}
.unit .totsu{stroke:var(--ink);stroke-width:1.2}
.unit.side-blue .totsu{fill:var(--blue)} .unit.side-red .totsu{fill:var(--red)}
.ulabel{font-family:var(--serif);font-weight:800;font-size:10px;fill:var(--unit-text);text-anchor:middle;dominant-baseline:central}
.men.stock{fill:#7A4A12}
.men,.badge{font-family:var(--sans);font-weight:700;font-size:9px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--map);stroke-width:3px}
.badge{font-family:var(--serif);font-size:10px}
.sel-ring{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.maps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.maps li{display:flex;gap:.3rem;align-items:stretch}
.maps button.pick{flex:1;min-width:0;text-align:left;display:flex;justify-content:space-between;gap:.5rem}
.maps button.pick span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maps .ren{flex:none;padding:.2rem .45rem;line-height:1}
.maps .del:hover{color:var(--red);border-color:var(--red)}
.maps .save.dirty{color:var(--btn-text);background:var(--blue);border-color:var(--blue)}
.maps-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.maps-head h2{margin:0}
.maps-head button{padding:.2rem .6rem;font-size:.85rem}
.maps .ren svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.maps input.name{flex:1;min-width:0;font:inherit;font-size:.9rem;padding:.3rem .45rem;background:var(--map);color:var(--ink);border:1px solid var(--blue);border-radius:4px}
.maps .tag{font-weight:500;font-size:.78rem;opacity:.8}
.brushes{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}
.brushes button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.3rem .2rem;font-size:.8rem}
.brushes img{width:44px;height:44px;object-fit:contain}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem}
button.on{outline:2px solid var(--ink);outline-offset:1px}
button.b-blue{background:var(--blue);color:#fff}button.b-red{background:var(--red);color:#fff}
textarea{width:100%;min-height:7rem;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;background:var(--map);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.5rem}
</style>
</head>
<body>
<header>
  <h1>マップ編集</h1>
  <p>地形・拠点・部隊・配置範囲を作れます。「ゲームで使う」で開いているゲーム画面に送られます。作ったマップはブラウザに下書きとして保存されます。一覧のフォルダのマークで、ゲームのフォルダ（data/maps）にファイルとして保存できます。</p>
</header>
<div class="bar"><div class="bar-in">
  <button id="bUse">ゲームで使う</button>
  <span class="status" id="status" role="status"></span>
</div></div>
<main class="layout">
  <div class="board-wrap" id="wrap"><svg id="board" role="img" aria-label="マップ"><g id="base"></g><g id="grid"></g><g id="units"></g></svg></div>
  <aside class="panel">
    <div class="box">
      <div class="tabs" role="tablist">
        <button data-mode="terrain">地形</button><button data-mode="features">拠点</button><button data-mode="units">部隊</button><button data-mode="zones" title="配置範囲">範囲</button>
      </div>
      <div id="tool" style="margin-top:.7rem"></div>
    </div>
    <div class="box" id="unitBox" hidden></div>
    <div class="box">
      <div class="maps-head"><h2>マップ</h2><button class="ghost" id="bNew">＋ 新規</button></div>
      <ul class="maps" id="maps"></ul>
      <div class="row"><label class="chk">大きさ <input type="number" id="iCols" aria-label="列の数"> 列 × <input type="number" id="iRows" aria-label="行の数"> 行</label><button class="ghost" id="bSize">変更</button></div>
      <div class="row"><button class="ghost" id="bRand">地形をランダムに作り直す</button></div>
      <div class="row"><label class="chk">赤軍のAI <select id="selAi"></select></label></div>
      <p class="hint" id="aiDesc"></p>
    </div>
    <details class="box">
      <summary>書き出し・読み込み</summary>
      <p class="hint" style="margin-top:.4rem">書き出した内容を Claude に渡すと、組み込みのマップにできます。ほかの人のマップは、貼り付けて「読み込む」と新しいマップとして追加されます。</p>
      <textarea id="io" aria-label="マップのデータ"></textarea>
      <div class="row"><button class="ghost" id="bExport">書き出す</button><button class="ghost" id="bCopy">コピー</button><button class="ghost" id="bImport">読み込む</button></div>
    </details>
  </aside>
</main>
<script src="hex-config.js"></script>
<script src="hex-board.js"></script>
<script src="data/index.js"></script>
<script>
const cfg=loadCfg();
const TER_LABEL={plain:'平地',forest:'森',hill:'丘',mountain:'山',river:'川'},SIDE_NAME={blue:'青軍',red:'赤軍'};
const TOTSU='M-16,9 L16,9 L16,-5 L7,-5 L7,-14 L-7,-14 L-7,-5 L-16,-5 Z';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=loadMaps(), editId=db.current, mode='terrain', brush='forest', featBrush='village', featStock='', zoneBrush='blue', side='blue', utype='spear'; // featStock＝置く拠点の蓄え（空欄なら本陣は無限、ほかはなし）
let selKey=null, drag=null, painting=false, saveTimer=null, renaming=null; // renaming＝名前を編集中のマップ
const MEN_UNIT=100; // 兵数の最小単位（人）
const svg=document.getElementById('board');
setupZoom(document.getElementById('wrap'),svg,'hex-zoom-maps');
const cur=()=>findMap(db,editId);
const setMsg=t=>{document.getElementById('status').textContent=t;};
const crOf=k=>{const [q,r]=k.split(',').map(Number);return {col:colOf(q,r),row:r};};
const unitAtKey=k=>{const {col,row}=crOf(k);return cur().units.find(u=>u.col===col&&u.row===row);};
const selUnit=()=>selKey?unitAtKey(selKey):null;
const cavOnMountain=(type,k)=>type==='cav'&&(terOf(cells.get(k))==='mountain'||featureAt.get(k)?.type==='fence'); // 騎兵は山と柵に置けない
function save(unitsChanged){
  if(unitsChanged)cur().rev=(cur().rev||0)+1; // 部隊を変えたら、ゲームはこのマップの初期配置から始め直す
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveMaps(db);setMsg('保存しました');},300);
}
function editable(){const m=cur();if(m.builtin){setMsg('「'+m.name+'」は組み込みのマップなので編集できません。「＋ 新規」で新しいマップを作ってください');return false;}return true;}

/* ---- 拠点の蓄え ---- */
// 本陣の蓄えが、その軍の全兵数の何日分にあたるか（1日2食）
const armyMen=s=>cur().units.filter(u=>u.side===s).reduce((n,u)=>n+(u.men||cfg.units[u.type].men),0);
const armyEat=s=>cur().units.filter(u=>u.side===s).reduce((n,u)=>n+(u.men||cfg.units[u.type].men)*(cfg.units[u.type].eat??1),0); // 1食で食べる量（騎兵は5倍）
const daysFor=(stock,eat)=>eat>0?Math.floor(stock/(eat*2)*10)/10:null;
function showStockDays(){
  const el=document.getElementById('stockDays');if(!el)return;
  const s=featBrush.split('-')[1],men=armyMen(s),eat=armyEat(s),v=featStock.trim();
  el.textContent=v===''?'空欄なので無限':!(Number(v)>=0)?'':men?'＝ '+Math.round(Number(v)*eat*2)+'（'+SIDE_NAME[s]+men+'人、騎兵は馬の分で5倍、1日2食。戦闘の開始時の兵数で決まります）':SIDE_NAME[s]+'の部隊がまだいません（部隊を置くと量が決まります）';
}
const featHasStock=()=>['honjin-blue','honjin-red','village','jinchi','fort'].includes(featBrush);
// 本陣は「全軍の何日分」（stockDays）、村・陣地・砦は量（stock）で覚える
function applyStock(f){if(!f)return;const v=featStock.trim(),ok=v!==''&&Number(v)>=0;delete f.stock;delete f.stockDays;
  if(!ok)return;if(f.type==='honjin')f.stockDays=Math.round(Number(v)*10)/10;else f.stock=Math.round(Number(v));}
// 盤に蓄えの量を出す（本陣で書いていなければ「無限」）
function stockLabels(){
  let h='';featureAt.forEach((f,k)=>{if(!holdsStock(f))return;const s=f.stock;if(s==null&&f.stockDays==null&&f.type!=='honjin')return;const c=cells.get(k);if(!c)return;
    const txt=f.type==='honjin'&&f.stockDays!=null?f.stockDays+'日分（'+Math.round(f.stockDays*armyEat(f.side)*2)+'）' // 本陣は日分で
      :s==null?'∞':s+(f.type==='honjin'&&daysFor(s,armyEat(f.side))!=null?'（'+daysFor(s,armyEat(f.side))+'日分）':'');
    h+='<text class="men stock" x="'+c.x+'" y="'+(c.y+S*K*0.62).toFixed(1)+'">蓄え'+txt+'</text>';});
  return h;
}
/* ---- 描画 ---- */
function drawBase(){useMap(cur());svg.setAttribute('viewBox',VB.join(' '));document.getElementById('base').innerHTML=boardSVG()+stockLabels();}
function drawGrid(){
  let h='';
  cells.forEach((c,k)=>{const z=zoneAt.get(k);h+='<polygon class="cell'+(z?' zone-'+z:'')+(drag&&drag.over===k?' drop':'')+'" data-key="'+k+'" points="'+hexPts(c.x,c.y)+'"/>';});
  document.getElementById('grid').innerHTML=h;
}
function drawUnits(){
  let h='';
  cur().units.forEach(u=>{
    const {q,r}=fromCR(u.col,u.row),k=key(q,r),c=cells.get(k);if(!c)return;
    const U=cfg.units[u.type];
    h+='<g class="unit side-'+u.side+'" transform="translate('+c.x+','+c.y+')">';
    if(k===selKey)h+='<ellipse class="sel-ring" rx="'+(S*0.8)+'" ry="'+(S*0.8*K).toFixed(1)+'"/>';
    h+='<g transform="rotate('+(SANG[u.f]+90).toFixed(1)+')"><path class="totsu" d="'+TOTSU+'"/></g><text class="ulabel">'+U.ch+'</text>';
    h+='<text class="men" y="22">'+(u.men||U.men)+'人</text>';
    if(RANKS[u.rank??1].ch)h+='<text class="men" x="15" y="2">'+RANKS[u.rank??1].ch+'</text>'; // 練度（並は印なし）
    h+='</g>';
  });
  document.getElementById('units').innerHTML=h;
}
function drawAll(){drawBase();drawGrid();drawUnits();drawUnitBox();}

/* ---- 右側の道具 ---- */
function drawTool(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.className=b.dataset.mode===mode?'':'ghost');
  svg.classList.toggle('m-zones',mode==='zones');
  const t=document.getElementById('tool');
  if(mode==='terrain'){
    t.innerHTML='<div class="brushes">'+TERRAINS.map(x=>'<button class="ghost'+(x===brush?' on':'')+'" data-t="'+x+'"><img src="tiles/'+x+'.png" alt="">'+TER_LABEL[x]+'</button>').join('')+'</div>'+
      '<p class="hint" style="margin-top:.5rem">クリックかドラッグで塗ります。川は隣り合う川マスどうしが自動でつながり、行き止まりは山か盤の端へ延びます。</p>';
    t.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{brush=b.dataset.t;drawTool();});
  }else if(mode==='features'){
    const F=[['honjin-blue','青の本陣'],['honjin-red','赤の本陣'],['village','村'],['jinchi','陣地'],['fort','砦（7）'],['fence','柵'],['none','消す']];
    t.innerHTML='<div class="pick">'+F.map(([f,l])=>'<button class="'+(f===featBrush?(f==='honjin-blue'?'b-blue ':f==='honjin-red'?'b-red ':'')+'on':'ghost')+'" data-f="'+f+'">'+l+'</button>').join('')+'</div>'+
      (featHasStock()?(featBrush.startsWith('honjin')
          ?'<div class="row" style="margin-top:.6rem"><label class="chk">蓄え 全軍の <input type="number" min="0" step="1" id="iStock" value="'+esc(featStock)+'" placeholder="空欄で無限"> 日分</label></div>'
          :'<div class="row" style="margin-top:.6rem"><label class="chk">蓄え <input type="number" min="0" step="100" id="iStock" value="'+esc(featStock)+'" placeholder="空欄でなし"> 食（1人1食分＝1）</label></div>')+
        (featBrush.startsWith('honjin')?'<p class="hint" id="stockDays"></p>':'')+
        '<p class="hint">この値で置きます。置いてある'+(featBrush.startsWith('honjin')?'本陣':'同じ拠点')+'をクリックすると、蓄えだけ書き換えます'+(featBrush==='fort'?'（砦は7マスで1つの蓄え）':'')+'。</p>':'')+
      '<p class="hint" style="margin-top:.5rem">本陣は各軍に1つで、置き直すと前の本陣は消えます。敵に占領されるとその軍の士気が大きく下がります。村は隠れられて兵が回復します。陣地（1マス）と砦は中の部隊の防御を上げます。砦は選んだマスを中央に周りの6マスごと置かれ、中央が特に堅くなります（どこか1マスを消すと砦全体が消えます）。柵は騎兵を止めます。柵・陣地・砦は攻撃で壊せます。本陣・村・陣地・砦には兵糧の蓄えを持たせられます。</p>';
    t.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{featBrush=b.dataset.f;drawTool();});
    const is=document.getElementById('iStock');if(is){is.oninput=()=>{featStock=is.value;showStockDays();};showStockDays();}
  }else if(mode==='units'){
    const cnt=s=>{const us=cur().units.filter(u=>u.side===s);return us.length+'部隊・'+us.reduce((n,u)=>n+(u.men||cfg.units[u.type].men),0)+'人';};
    t.innerHTML='<div class="pick">'+['blue','red'].map(s=>'<button class="'+(s===side?'b-'+s+' on':'ghost')+'" data-side="'+s+'">'+SIDE_NAME[s]+'</button>').join('')+'<span></span>'+
      UNIT_TYPES.map(x=>'<button class="'+(x===utype?'on':'ghost')+'" data-type="'+x+'">'+cfg.units[x].name+'</button>').join('')+'</div>'+
      '<p class="hint" style="margin-top:.5rem">空いたマスをクリックすると、選んだ部隊を置きます。部隊はドラッグで動かせます。部隊を選んで Q／E で向き、Delete で削除。</p>'+
      '<p class="hint" style="margin-top:.3rem">青軍 '+cnt('blue')+'　赤軍 '+cnt('red')+'</p>';
    t.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;drawTool();});
    t.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{utype=b.dataset.type;drawTool();});
  }else{
    t.innerHTML='<div class="pick">'+[['blue','青軍'],['red','赤軍'],['none','消す']].map(([z,l])=>'<button class="'+(z===zoneBrush?(z==='none'?'':'b-'+z)+' on':'ghost')+'" data-z="'+z+'">'+l+'</button>').join('')+'</div>'+
      '<p class="hint" style="margin-top:.5rem">塗ったマスが、ゲームの配置画面でその軍の部隊を動かせる範囲になります。部隊の初期配置はこの範囲の外にも置けます。</p>'+
      '<div class="row"><button class="ghost" id="bZoneReset"'+(cur().zones?'':' disabled')+'>既定（両端の3列）に戻す</button></div>';
    t.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{zoneBrush=b.dataset.z;drawTool();});
    document.getElementById('bZoneReset').onclick=()=>{if(!editable())return;delete cur().zones;save(false);drawAll();drawTool();};
  }
}
function drawUnitBox(){
  const box=document.getElementById('unitBox'),u=mode==='units'?selUnit():null;
  box.hidden=!u;if(!u)return;
  const U=cfg.units[u.type];
  box.innerHTML='<h2>'+SIDE_NAME[u.side]+U.name+'</h2>'+
    '<div class="row"><label class="chk">兵数 <input type="number" min="'+MEN_UNIT+'" step="'+MEN_UNIT+'" id="iMen" value="'+(u.men||U.men)+'"> 人</label></div>'+
    '<div class="row"><label class="chk">練度 <select id="selRank">'+RANKS.map((r,i)=>'<option value="'+i+'"'+((u.rank??1)===i?' selected':'')+'>'+r.name+'</option>').join('')+'</select></label></div>'+
    '<div class="row"><button class="ghost" id="bRotL">↺ 左へ</button><button class="ghost" id="bRotR">↻ 右へ</button><button class="ghost" id="bDelU">削除</button></div>';
  const im=document.getElementById('iMen');
  // 兵数は100人単位（入力された値は近い100の倍数にそろえる）
  im.onchange=()=>{if(!editable())return;const v=parseFloat(im.value);if(v>0){u.men=Math.max(MEN_UNIT,Math.round(v/MEN_UNIT)*MEN_UNIT);im.value=u.men;save(true);drawUnits();drawTool();}else im.value=u.men||U.men;};
  im.onkeydown=e=>{if(e.key==='Enter')im.blur();};
  document.getElementById('selRank').onchange=e=>{if(!editable())return;const v=+e.target.value;if(v===1)delete u.rank;else u.rank=v;save(true);drawUnits();};
  document.getElementById('bRotL').onclick=()=>rotate(-1);
  document.getElementById('bRotR').onclick=()=>rotate(1);
  document.getElementById('bDelU').onclick=removeSel;
}
function rotate(dl){const u=selUnit();if(!u||!editable())return;u.f=(u.f+dl+6)%6;save(true);drawUnits();}
function removeSel(){const u=selUnit();if(!u||!editable())return;const m=cur();m.units=m.units.filter(x=>x!==u);selKey=null;save(true);drawUnits();drawUnitBox();drawTool();}
function drawList(){
  // 各マップの横の鉛筆で、その場で名前を変えられる（組み込みのマップは変えられない）
  const PEN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
  const SAVE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13l3 3 3-3"/></svg>';
  const BIN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>';
  document.getElementById('maps').innerHTML=db.maps.map(m=>'<li>'+(renaming===m.id
    ?'<input class="name" id="iName" value="'+esc(m.name)+'" aria-label="マップの名前">'
    :'<button class="pick '+(m.id===editId?'':'ghost')+'" data-id="'+m.id+'"><span>'+esc(m.name)+'</span><span class="tag">'+
      [m.builtin?'組み込み':m.registered?(mapChangedFromFile(m)?'未保存の変更あり':'保存済み'):'下書き',m.id===db.current?'ゲームで使用中':''].filter(Boolean).join('・')+'</span></button>'+
      (m.builtin?'':(!m.registered||mapChangedFromFile(m)?'<button class="ghost ren save'+(m.registered?' dirty':'')+'" data-save="'+m.id+'" title="フォルダ（data/maps）に保存" aria-label="「'+esc(m.name)+'」をフォルダに保存">'+SAVE+'</button>':'')+
        '<button class="ghost ren" data-ren="'+m.id+'" title="名前を変える" aria-label="「'+esc(m.name)+'」の名前を変える">'+PEN+'</button>'+
        '<button class="ghost ren del" data-del="'+m.id+'" title="削除" aria-label="「'+esc(m.name)+'」を削除">'+BIN+'</button>'))+'</li>').join('');
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{editId=b.dataset.id;selKey=null;refresh();});
  document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{renaming=b.dataset.ren;drawList();});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const m=db.maps.find(x=>x.id===b.dataset.save);if(m)saveToFolder(m);});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const m=db.maps.find(x=>x.id===b.dataset.del);if(m)deleteMap(m);});
  const inp=document.getElementById('iName');
  if(inp){inp.focus();inp.select();
    const done=ok=>{if(renaming==null)return;const m=db.maps.find(x=>x.id===renaming);renaming=null;
      if(ok&&m&&inp.value.trim()&&inp.value.trim()!==m.name){m.name=inp.value.trim();saveMaps(db);setMsg('名前を「'+m.name+'」にしました');}drawList();};
    inp.onkeydown=e=>{if(e.key==='Enter')done(true);else if(e.key==='Escape')done(false);};
    inp.onblur=()=>done(true);}
  const m=cur();
  document.getElementById('bSize').disabled=document.getElementById('bRand').disabled=!!m.builtin;
  const ic=document.getElementById('iCols'),ir=document.getElementById('iRows');
  const sa=document.getElementById('selAi'),ai=m.ai||'random';
  sa.innerHTML='<option value="random">ランダム（決着まで伏せる）</option>'+Object.entries(AI_STYLES).map(([k,n])=>'<option value="'+k+'">'+n+'</option>').join('');
  sa.value=ai;sa.disabled=!!m.builtin;document.getElementById('aiDesc').textContent=ai==='random'?'戦闘ごとに作戦が選ばれます。':AI_STYLE_DESC[ai];
  ic.value=m.cols;ir.value=m.rows;ic.min=SIZE_MIN.cols;ic.max=SIZE_MAX.cols;ir.min=SIZE_MIN.rows;ir.max=SIZE_MAX.rows;ic.disabled=ir.disabled=!!m.builtin;
  document.getElementById('wrap').classList.toggle('readonly',!!m.builtin);
}
function refresh(){drawAll();drawList();drawTool();setMsg(cur().builtin?'組み込みのマップは編集できません。「＋ 新規」で新しいマップを作ってください':'');}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selKey=null;drawTool();drawUnits();drawUnitBox();});

/* ---- 盤面の操作 ---- */
function paintAt(k){
  if(!k||!editable())return;
  const m=cur(),{col,row}=crOf(k),ck=col+','+row;
  if(mode==='terrain'){
    if((m.terrain[ck]||'plain')===brush)return;
    if(brush==='plain')delete m.terrain[ck];else m.terrain[ck]=brush;
    save(false);drawBase();drawUnits();
  }else if(mode==='features'){
    if(!m.features)m.features={};
    const [type,fside]=featBrush.split('-'),old=m.features[ck];
    const removeFort=fid=>Object.keys(m.features).forEach(x=>{if(m.features[x].fid===fid)delete m.features[x];}); // 砦は7マスまとめて消す
    const clear=x=>{const o=m.features[x];if(!o)return;if(o.type==='fort')removeFort(o.fid);else delete m.features[x];};
    if(featBrush==='none'){if(!old)return;clear(ck);}
    else if(type==='fort'){
      if(old&&old.type==='fort'){applyStock(m.features[old.fid]);save(false);drawBase();drawUnits();return;} // 砦をクリック：中央の蓄えだけ書き換える
      // 選んだマスを中央に、周りの6マス（盤の中だけ）ごと置く
      const [q,r]=k.split(',').map(Number),parts=[k,...DIRS.map(d=>key(q+d[0],r+d[1])).filter(x=>cells.has(x))];
      const crk=x=>{const o=crOf(x);return o.col+','+o.row;};
      parts.forEach(x=>clear(crk(x)));
      parts.forEach((x,i)=>{m.features[crk(x)]={type:'fort',part:i?'ring':'core',fid:ck};});applyStock(m.features[ck]);
    }else{
      if(old&&old.type===type&&old.side===fside){if(!featHasStock())return;applyStock(old);} // 同じ拠点をクリック：蓄えだけ書き換える
      else{
        clear(ck);
        if(type==='honjin')Object.keys(m.features).forEach(x=>{const o=m.features[x];if(o.type==='honjin'&&o.side===fside)delete m.features[x];}); // 本陣は各軍に1つ
        m.features[ck]=type==='honjin'?{type,side:fside}:{type};applyStock(m.features[ck]);
      }
    }
    save(false);drawBase();drawUnits();
  }else if(mode==='zones'){
    if(!m.zones)m.zones=defaultZones();
    if((m.zones[ck]||'none')===zoneBrush)return;
    if(zoneBrush==='none')delete m.zones[ck];else m.zones[ck]=zoneBrush;
    save(false);useMap(m);drawGrid();drawTool();
  }
}
const keyAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('[data-key]')?.dataset.key:null;};
svg.addEventListener('pointerdown',e=>{
  const k=e.target.closest('[data-key]')?.dataset.key;if(!k)return;
  svg.setPointerCapture(e.pointerId);
  if(mode!=='units'){painting=true;paintAt(k);return;}
  const u=unitAtKey(k);
  if(u){selKey=k;drag={from:k,over:k};drawUnits();drawUnitBox();return;}
  if(!editable())return;
  if(cavOnMountain(utype,k)){setMsg('騎兵は山に置けません');return;}
  const {col,row}=crOf(k);
  cur().units.push({side,type:utype,col,row,f:side==='blue'?0:3,men:Math.max(MEN_UNIT,Math.round(cfg.units[utype].men/MEN_UNIT)*MEN_UNIT)});
  selKey=k;save(true);drawUnits();drawUnitBox();drawTool();
});
svg.addEventListener('pointermove',e=>{
  if(painting)paintAt(keyAt(e));
  else if(drag){const k=keyAt(e);if(k&&k!==drag.over){drag.over=k;drawGrid();}}
});
function endPointer(){
  painting=false;
  if(drag){
    const {from,over}=drag,u=unitAtKey(from);drag=null;
    if(u&&over&&over!==from&&!unitAtKey(over)&&editable()){
      if(cavOnMountain(u.type,over))setMsg('騎兵は山に置けません');
      else{const {col,row}=crOf(over);u.col=col;u.row=row;selKey=over;save(true);}
    }
    drawGrid();drawUnits();drawUnitBox();
  }
}
['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,endPointer));
document.addEventListener('keydown',e=>{
  if(mode!=='units'||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='q'||e.key==='Q')rotate(-1);
  else if(e.key==='e'||e.key==='E')rotate(1);
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSel();}
  else if(e.key==='Escape'){selKey=null;drawUnits();drawUnitBox();}
});

/* ---- マップの管理 ---- */
// 盤の大きさを変える。はみ出す地形・拠点・部隊・配置範囲は消える
document.getElementById('bSize').onclick=()=>{
  const m=cur();if(!editable())return;
  const cols=Math.round(+document.getElementById('iCols').value),rows=Math.round(+document.getElementById('iRows').value);
  if(!(cols>=SIZE_MIN.cols&&cols<=SIZE_MAX.cols&&rows>=SIZE_MIN.rows&&rows<=SIZE_MAX.rows)){setMsg('大きさは '+SIZE_MIN.cols+'〜'+SIZE_MAX.cols+' 列、'+SIZE_MIN.rows+'〜'+SIZE_MAX.rows+' 行です');return;}
  if(cols===m.cols&&rows===m.rows)return;
  const next=cleanMap({...m,cols,rows});
  const lost=(Object.keys(m.terrain).length-Object.keys(next.terrain).length)+(Object.keys(m.features||{}).length-Object.keys(next.features).length)+(m.units.length-next.units.length);
  if(lost>0&&!confirm('盤の外に出る地形・拠点・部隊（'+lost+'件）は消えます。よろしいですか？'))return;
  Object.assign(m,next,{rev:(m.rev||0)+1});selKey=null;
  clearTimeout(saveTimer);saveMaps(db);refresh();setMsg('盤の大きさを '+cols+'×'+rows+' にしました');
};
const newId=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addMap(src){const m=cleanMap({...src,id:newId()});db.maps.push(m);editId=m.id;selKey=null;saveMaps(db);refresh();return m;}
/* ---- 地形のランダム生成 ---- */
// 森・丘はかたまりで、山は小さな山並みで置き、川は6割くらいの確率で盤の端から端へ1本流す。布陣する左右の端2列には山を置かない
function randomTerrain(cols,rows){
  const t={},R=n=>Math.floor(Math.random()*n),ck=(c,r)=>c+','+r,inside=(c,r)=>c>=0&&c<cols&&r>=0&&r<rows;
  const nbs=(c,r)=>{const p=fromCR(c,r);return DIRS.map(([dq,dr])=>{const q=p.q+dq,rr=p.r+dr;return {col:colOf(q,rr),row:rr};}).filter(o=>inside(o.col,o.row));};
  const blobs=(type,share,minSize,maxSize,ok)=>{
    let left=Math.round(cols*rows*share);
    for(let tries=0;left>0&&tries<200;tries++){
      const size=minSize+R(maxSize-minSize+1),start={col:R(cols),row:R(rows)};if(t[ck(start.col,start.row)]||!ok(start.col))continue;
      const grown=[start];t[ck(start.col,start.row)]=type;left--;
      while(grown.length<size&&left>0){const b=grown[R(grown.length)],n=nbs(b.col,b.row).filter(o=>!t[ck(o.col,o.row)]&&ok(o.col));if(!n.length)break;const o=n[R(n.length)];t[ck(o.col,o.row)]=type;grown.push(o);left--;}
    }
  };
  blobs('mountain',0.04,2,4,c=>c>=2&&c<cols-2);
  blobs('forest',0.15,3,8,()=>true);
  blobs('hill',0.08,2,5,()=>true);
  if(Math.random()<0.6){ // 川：上の端から下の端へ（山は避け、左右にゆれながら）
    let c=2+R(Math.max(1,cols-4)),r=0;
    for(let steps=0;steps<rows*3&&r<rows;steps++){
      if(t[ck(c,r)]!=='mountain')t[ck(c,r)]='river';
      const n=nbs(c,r).filter(o=>o.row>=r&&t[ck(o.col,o.row)]!=='mountain'&&t[ck(o.col,o.row)]!=='river');
      const down=n.filter(o=>o.row>r);const pick=(down.length&&Math.random()<0.75?down:n);if(!pick.length)break;
      const o=pick[R(pick.length)];if(o.row===r&&o.row===rows-1)break;c=o.col;r=o.row;
    }
  }
  return t;
}
document.getElementById('bNew').onclick=()=>{const n=prompt('新しいマップの名前','新しいマップ');if(n!==null)addMap({name:n.trim()||'新しいマップ',terrain:randomTerrain(14,10),features:{},units:[]});};
document.getElementById('bRand').onclick=()=>{
  if(!editable())return;const m=cur();
  if(Object.keys(m.terrain||{}).length&&!confirm('いまの地形を消して、ランダムに作り直しますか？（拠点と部隊はそのまま残ります）'))return;
  m.terrain=randomTerrain(m.cols,m.rows);save(false);drawAll();setMsg('地形をランダムに作り直しました');
};
document.getElementById('selAi').onchange=e=>{const m=cur();if(m.builtin)return;if(e.target.value==='random')delete m.ai;else m.ai=e.target.value;saveMaps(db);drawList();};
// 削除は必ず確認してから。フォルダに保存したマップは、ファイルごと消す
async function deleteMap(m){
  if(m.builtin)return;
  if(m.registered){
    let root;try{root=await dataFolder();}catch(e){if(e.name!=='AbortError')setMsg('フォルダを開けませんでした：'+e.message);return;}
    if(!root)return;
    if(!confirm('本当に「'+m.name+'」を削除しますか？\nフォルダのファイル（data/maps/'+m.id+'.js）も消えます。元に戻せません。'))return;
    try{const maps=await root.getDirectoryHandle('maps',{create:true});
      try{await maps.removeEntry(m.id+'.js');}catch(e){}
      await writeIndex(root);}catch(e){setMsg('フォルダから削除できませんでした：'+e.message);return;}
  }else if(!confirm('本当に「'+m.name+'」を削除しますか？\n元に戻せません。'))return;
  db.maps=db.maps.filter(x=>x!==m);if(db.current===m.id)db.current='standard';if(editId===m.id)editId=db.current;selKey=null;saveMaps(db);refresh();setMsg('「'+m.name+'」を削除しました');
}
/* ---- フォルダに保存（Chrome のファイル操作で、ゲームのフォルダの data/ に書き込む） ---- */
// 選んだフォルダは IndexedDB に覚えておき、次からは聞き直さない（書き込みの許可だけ確認する）
const idb=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('hex-folder',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');
  r.onsuccess=()=>{const t=r.result.transaction('h',mode),q=fn(t.objectStore('h'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);};r.onerror=()=>rej(r.error);});
// Chrome はボタンを押した直後にしかフォルダの選択や許可の確認を出させないので、クリックしたら最初にこれを呼ぶ
// （先に入力欄や確認を出すと「押した直後」の扱いが切れて断られる）。選んだフォルダはページを開いたときに読み込んでおく
let folderHandle=null;idb('readonly',s=>s.get('root')).then(h=>{folderHandle=h||null;}).catch(()=>{});
async function dataFolder(){
  if(!window.showDirectoryPicker){setMsg('このブラウザではフォルダに書き込めません（Chrome で開いてください）');return null;}
  if(folderHandle){
    if((await folderHandle.requestPermission({mode:'readwrite'}))==='granted')return await folderHandle.getDirectoryHandle('data',{create:true});
    setMsg('フォルダへの書き込みが許可されませんでした。もう一度押して、許可してください');return null;
  }
  setMsg('ゲームのフォルダ（hex-facing-prototype.html がある「hex」フォルダ）を選んでください');
  const h=await window.showDirectoryPicker({id:'hex-root',mode:'readwrite'});
  try{await h.getFileHandle('hex-facing-prototype.html');}catch(e){setMsg('選んだフォルダが違います。「hex」フォルダ（hex-facing-prototype.html があるフォルダ）を選んでください');return null;}
  folderHandle=h;try{await idb('readwrite',s=>s.put(h,'root'));}catch(e){}
  return await h.getDirectoryHandle('data',{create:true});
}
async function writeText(dir,name,text){const f=await dir.getFileHandle(name,{create:true}),w=await f.createWritable();await w.write(text);await w.close();}
// data/maps・data/campaigns にあるファイルから目録（data/index.js）を作り直す
async function writeIndex(root){
  const list=async name=>{const out=[];const d=await root.getDirectoryHandle(name,{create:true});for await(const [n,e] of d.entries())if(e.kind==='file'&&n.endsWith('.js'))out.push(n.slice(0,-3));return out.sort();};
  const maps=await list('maps'),camps=await list('campaigns');
  await writeText(root,'index.js','// 朧 OBORO：フォルダに保存したデータの目録（マップ編集でフォルダに保存すると自動的に書き換わります）\n'+
    'HEX_DATA.files={maps:'+JSON.stringify(maps)+',campaigns:'+JSON.stringify(camps)+'};\n'+
    "HEX_DATA.files.maps.forEach(f=>document.write('<script src=\"data/maps/'+f+'.js\"><\\/script>'));\n"+
    "HEX_DATA.files.campaigns.forEach(f=>document.write('<script src=\"data/campaigns/'+f+'.js\"><\\/script>'));\n");
}
// ファイル名にもなる保存名（英小文字・数字・ハイフン）
const REG_NAME=/^[a-z0-9][a-z0-9-]{0,39}$/;
async function saveToFolder(m){
  clearTimeout(saveTimer);if(m.builtin)return;
  let root;try{root=await dataFolder();}catch(e){if(e.name!=='AbortError')setMsg('フォルダを開けませんでした：'+e.message);return;}
  if(!root)return;
  let id=m.id;
  if(!m.registered){
    const n=prompt('保存名（ファイル名になります。英小文字・数字・ハイフンで。例：sekigahara-1）',REG_NAME.test(m.id)&&!/^m[a-z0-9]{8,}$/.test(m.id)?m.id:'');
    if(n===null)return;id=n.trim();
    if(!REG_NAME.test(id)){setMsg('保存名は英小文字・数字・ハイフンで、40文字までにしてください');return;}
    if(db.maps.some(x=>x!==m&&x.id===id)){setMsg('「'+id+'」はほかのマップで使われています');return;}
  }
  try{
    const maps=await root.getDirectoryHandle('maps',{create:true}),o=cleanMap({...m,id});
    await writeText(maps,id+'.js','// 朧 OBORO マップ：'+o.name.replace(/[\r\n]/g,' ')+'\nHEX_DATA.maps.push('+JSON.stringify(o,null,1)+');\n');
    await writeIndex(root);
    if(db.current===m.id)db.current=id;
    // フォルダのものと同じになったので、ブラウザの下書きからは外す（次に開いたときはフォルダから読み込む）
    const i=HEX_DATA.maps.findIndex(x=>x.id===id);if(i>=0)HEX_DATA.maps[i]=o;else HEX_DATA.maps.push(o);
    const was=editId===m.id;Object.assign(m,{id,registered:true});if(was)editId=id;saveMaps(db);refresh();
    setMsg('「'+o.name+'」を data/maps/'+id+'.js に保存しました');
  }catch(e){if(e.name!=='AbortError')setMsg('保存できませんでした：'+e.message);}
}
document.getElementById('bUse').onclick=()=>{
  clearTimeout(saveTimer);db.current=editId;saveMaps(db);drawList();
  const g=window.opener&&!window.opener.closed?window.opener:null;
  if(g)g.postMessage({type:MAP_MSG},'*');
  setMsg('「'+cur().name+'」をゲームで使います（戦闘中なら次の戦闘から）');
};
document.getElementById('bExport').onclick=()=>{const m=cur(),o={name:m.name,cols:m.cols,rows:m.rows,terrain:m.terrain,features:m.features||{},units:m.units};if(m.zones)o.zones=m.zones;if(m.ai)o.ai=m.ai;document.getElementById('io').value=JSON.stringify(o);};
document.getElementById('bCopy').onclick=async()=>{const ta=document.getElementById('io');try{await navigator.clipboard.writeText(ta.value);}catch(e){ta.select();document.execCommand('copy');}setMsg('コピーしました');};
document.getElementById('bImport').onclick=()=>{
  try{const o=JSON.parse(document.getElementById('io').value);if(!o||typeof o!=='object'||typeof o.terrain!=='object')throw 0;addMap({...o,name:o.name||'読み込んだマップ'});setMsg('読み込みました');}
  catch(e){setMsg('読み込めませんでした。書き出した内容をそのまま貼り付けてください');}
};
// ほかのタブでマップが選ばれたら一覧を更新
window.addEventListener('storage',e=>{if(e.key===MAPS_STORE){db=loadMaps();if(!db.maps.some(m=>m.id===editId))editId=db.current;refresh();}});

refresh();
