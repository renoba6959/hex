<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>朧 OBORO ― Hex Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hex-common.css">
<style>
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:1rem;max-width:1200px;margin:0 auto;padding:.6rem 1.25rem 1rem}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.board-wrap{align-self:start;background:var(--map);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
svg#board{display:block;width:100%;height:auto;min-width:600px;touch-action:manipulation;user-select:none}
.cell{fill:transparent;stroke:var(--ink);stroke-opacity:.18;stroke-width:1;cursor:pointer}
.cell.arc-blue{fill:var(--arc-blue)} .cell.arc-red{fill:var(--arc-red)}
.cell.zoc{fill:var(--zoc)}
.cell.move{fill:var(--move);fill-opacity:.6} .cell.target{fill:var(--target);fill-opacity:.7}
.tile{pointer-events:none}
.rv{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.rv-bank{stroke:#7A7461}.rv-water{stroke:#3590D6}.rv-shine{stroke:#7CCBF5;opacity:.9}
.lbl{font-family:var(--sans);font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:3px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dmg{font-size:12px;paint-order:stroke;stroke:var(--map);stroke-width:3px}
.unit{cursor:pointer}
.unit .totsu{stroke:var(--ink);stroke-width:1.2}
.unit.side-blue .totsu{fill:var(--blue)} .unit.side-red .totsu{fill:var(--red)}
.unit.done{opacity:.55}
.ulabel{font-family:var(--serif);font-weight:800;font-size:10px;fill:var(--unit-text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hpbg{fill:var(--grid)} .hp{fill:var(--ink)}
.men{font-family:var(--sans);font-weight:700;font-size:9px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--map);stroke-width:3px;pointer-events:none} .mor{fill:#D8A23A} .mor.low{fill:var(--red)}
.dis{font-family:var(--serif);font-weight:800;font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:3px}
.dis.conf{fill:var(--red)}
.result{list-style:none;margin:.2rem 0 0;padding:0;font-size:.82rem;line-height:1.6}.result li{border-bottom:1px solid var(--line);padding:.35rem 0}.result .rh{display:flex;justify-content:space-between;gap:.5rem}.result .rh span{color:var(--muted)}
.stars{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.82rem;color:#C08A1E;letter-spacing:.05em;margin-left:.2rem}
.rankrow{display:flex;column-gap:.7rem;row-gap:.25rem;align-items:center;flex-wrap:wrap}.rankrow>span{display:inline-flex;align-items:center;gap:.3rem}
.unit.hid .totsu,.mark .totsu{fill-opacity:.5;stroke-dasharray:3 2}
.mark{pointer-events:none;opacity:.75}
.lbl.taken{fill:var(--red);font-size:12px}
.supply-halo{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:4.5;stroke-linecap:round;pointer-events:none}
.supply-edge{fill:none;stroke:#13803A;stroke-width:2.6;stroke-dasharray:6 4;stroke-linecap:round;pointer-events:none}
.supply-fill{fill:#3FB25A;fill-opacity:.22;stroke:none}
.route{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3;opacity:.6;pointer-events:none}
.badge.food{fill:#B07A1A}.badge.food.out{fill:var(--red)}
.fog{fill:#141A28;fill-opacity:.42;stroke:none}
.badge{font-family:var(--serif);font-weight:800;font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:3px}.badge.pend{opacity:.5}
.shot{fill:var(--red);stroke:var(--map);stroke-width:1.5;pointer-events:none}
.prompt{border-left-color:var(--target)}
button.on{outline:2px solid var(--ink);outline-offset:1px}
button.q{width:1.15rem;height:1.15rem;padding:0;margin-left:.2rem;border-radius:50%;font-size:.7rem;line-height:1;vertical-align:.08em;background:transparent;color:var(--muted);border:1px solid var(--line)}
button.q.open{background:var(--ink);color:var(--map);border-color:var(--ink)}
.tipbox{margin:.3rem 0 0;padding:.35rem .5rem;border-left:3px solid var(--line)}
.sel-ring{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.panel{display:flex;flex-direction:column;gap:.8rem}
.turn{font-family:var(--serif);font-weight:800;font-size:1.15rem;letter-spacing:.04em;padding-left:.6rem;border-left:5px solid var(--blue)}
.turn.side-red{border-left-color:var(--red)}
.uname{font-family:var(--serif);font-weight:800;font-size:1.05rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.1rem .8rem;margin:.4rem 0 0;font-size:.9rem}
dt{color:var(--muted)} dd{margin:0}
#log{list-style:none;margin:.3rem 0 0;padding:0;max-height:260px;overflow-y:auto;font-size:.84rem}
#log li{padding:.3rem 0;border-bottom:1px solid var(--line)}
#log li.sys{color:var(--muted)}
#log li.kill{font-weight:700}
</style>
</head>
<body>
<header>
  <h1>朧<span class="en">OBORO</span><span class="sub">Hex Tactics</span></h1>
</header>

<main class="layout">
  <div class="board-wrap"><svg id="board" role="img" aria-label="ヘックスマップ"></svg></div>
  <aside class="panel">
    <div class="box" id="turnBox"></div>
    <div class="box" id="unitBox"></div>
    <div class="box"><h2>戦闘記録</h2><ol id="log"></ol></div>
  </aside>
</main>


<script src="hex-config.js"></script>
<script src="hex-board.js"></script>
<script src="data/index.js"></script>
<script>
const SIDE_NAME={blue:'青軍',red:'赤軍'};
const FORM_STORE='hex-facing-formation-v4';
// 配置：byMap＝マップごとに配置画面で動かした位置・向き {rev,units}。伏せるのはゲーム中の「隠蔽」で。部隊の数や兵数はマップ編集で決める
let formation={byMap:{}};
try{const o=JSON.parse(localStorage.getItem(FORM_STORE));if(o&&o.byMap&&typeof o.byMap==='object')formation=o;}catch(e){}
function saveFormation(){
  formation.byMap[state.mapId]={rev:state.mapRev,units:state.units.map(u=>({side:u.side,type:u.type,q:u.q,r:u.r,f:u.f,men:u.men0,rankA:u.rankA0,rankD:u.rankD0}))};
  try{localStorage.setItem(FORM_STORE,JSON.stringify(formation));}catch(e){}
}

let cfg=loadCfg();

const COVER=new Set(['forest','hill','mountain']); // 隠れられる地形
const onCover=p=>COVER.has(terOf(p))||featOf(p)?.type==='village'; // 村にも隠れられる
// 柵・陣地・砦の状態（マスのキー → {hp, done}）。hp は工事でたまり攻撃で減る。done＝一度完成した（騎兵を止めるのは完成後）
let struct={};
const STRUCTS=['fence','jinchi','fort'];
const maxOf=type=>({fence:cfg.fenceHp,jinchi:cfg.jinchiHp,fort:cfg.fortHp})[type];
const structType=p=>{const f=featOf(p);return f&&STRUCTS.includes(f.type)&&struct[key(p.q,p.r)]?.hp>0?f.type:null;};
const structName=p=>{const f=featOf(p);return f.type==='fort'?(f.part==='core'?'砦の中央':'砦の外周'):{fence:'柵',jinchi:'陣地'}[f.type];};
const fullDef=p=>{const f=featOf(p);return f.type==='fence'?cfg.fenceDef:f.type==='jinchi'?cfg.jinchiDef:f.part==='core'?cfg.fortCoreDef:cfg.fortRingDef;}; // 完成時の防御倍率
const ratioOf=p=>{const t=structType(p);return t?Math.min(1,struct[key(p.q,p.r)].hp/maxOf(t)):0;}; // 効果の割合＝耐久の割合
const fenceAt=p=>structType(p)==='fence'&&struct[key(p.q,p.r)].done; // 騎兵を止める柵
const fmt=x=>Math.round(x*10)/10;
const honjinOf=side=>{for(const [k,f] of featureAt)if(f.type==='honjin'&&f.side===side){const [q,r]=k.split(',').map(Number);return {q,r};}return null;};
const terCfg=p=>cfg.terrain[terOf(p)]||{move:0,def:1,atk:1};
const cavBlocked=(type,p)=>type==='cav'&&(terOf(p)==='mountain'||fenceAt(p)); // 騎兵は山と柵に入れない
const TOTSU='M-16,9 L16,9 L16,-5 L7,-5 L7,-14 L-7,-14 L-7,-5 L-16,-5 Z';

function relAngle(u,pos){
  const a=toPix(u.q,u.r),b=toPix(pos.q,pos.r);
  let d=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI-60*u.f;
  d=((d%360)+540)%360-180;return Math.abs(d);
}

/* ---- game state ---- */
let state, showZoc=false, editOpen=false, buildFor=null; // editOpen：手番の欄の「エディット」を開いているか／buildFor：「建築」を開いている部隊
let showSupply=true;try{showSupply=localStorage.getItem('hex-supply-show')!=='0';}catch(e){}
function newGame(edit){
  gen++;busy=false;
  const db=loadMaps(),map=findMap(db,db.current);useMap(map); // 戦闘中にマップが編集されても、この戦闘の地形は変わらない
  struct={};featureAt.forEach((f,k)=>{if(STRUCTS.includes(f.type))struct[k]={hp:maxOf(f.type),done:true};}); // マップの柵・陣地・砦は完成済み
  let id=0;const units=[];
  const add=(side,type,q,r,f,men,ra,rd)=>{
    if(!TYPES.includes(type)||!SIDE_NAME[side]||!cells.has(key(q,r))||units.some(u=>u.q===q&&u.r===r))return;
    units.push(makeUnit(id++,side,type,q,r,f,men,ra,rd));
  };
  // 配置画面で動かした配置があればそれを使う。マップの部隊が編集されたら、マップの初期配置に戻る
  const saved=formation.byMap[map.id];
  if(saved&&saved.rev===map.rev&&Array.isArray(saved.units))saved.units.forEach(o=>add(o.side,o.type,o.q,o.r,o.f,o.men,o.rankA,o.rankD));
  else (map.units||[]).forEach(o=>{const c=fromCR(o.col,o.row);add(o.side,o.type,c.q,c.r,o.f,o.men,o.rankA,o.rankD);});
  units.filter(u=>cavBlocked(u.type,u)).forEach(u=>{const c=[...cells.values()].filter(c=>!cavBlocked(u.type,c)&&!units.some(x=>x.q===c.q&&x.r===c.r)).sort((a,b)=>dist(a,u)-dist(b,u))[0];if(c){u.q=c.q;u.r=c.r;}}); // 山に置かれた騎兵は近くの山以外へよける
  renumber(units);
  state={units,mapId:map.id,mapName:map.name,mapRev:map.rev,phase:'setup',prompt:null,march:'hidden',side:'blue',turn:1,selected:null,log:[],winner:null,history:[],memo:{blue:{},red:{}},known:{},taken:{blue:false,red:false},stock:{},gone:[],result:null,retreating:[]}; // gone＝この戦闘でいなくなった部隊（結果に使う）
  // 本陣・村・陣地・砦の蓄え（1人1食分＝1）。本陣を「全軍の何日分」で決めたマップは、開始時の兵数×2食×日数にする
  featureAt.forEach((f,k)=>{if(!holdsStock(f))return;
    if(f.type==='honjin'&&f.stockDays!=null){const eat=units.filter(u=>u.side===f.side).reduce((n,u)=>n+u.men0*(cfg.units[u.type].eat??1),0);state.stock[k]=Math.round(f.stockDays*eat*2);} // 騎兵は5倍で数える
    else state.stock[k]=stockOfFeat(f);});
  if(!edit&&canStart()){startBattle();return;} // 保存済みの配置でそのまま始める
  log(canStart()?'配置：部隊の位置と向きを決めてください':'このマップには両軍の部隊がそろっていません。マップ編集で部隊を置いてください','sys');render();
}
// 戦闘の途中なら確認してから配置画面へ
function editFormation(){
  if(state.phase==='battle'&&!state.winner&&(state.turn>1||state.history.length)&&!confirm('配置に戻ると、今の戦闘は最初からになります。よろしいですか？'))return;
  newGame(true);
}
const canStart=()=>['blue','red'].every(s=>state.units.some(u=>u.side===s));
function startBattle(){
  if(state.phase!=='setup'||!canStart())return;
  state.phase='battle';state.selected=null;
  // 赤軍AIの作戦：ゲーム画面で選んだもの、なければマップの設定。ランダムなら決着まで伏せる
  const pick=aiPick==='map'?(findMap(loadMaps(),state.mapId).ai||'random'):aiPick,ks=Object.keys(AI_STYLES);
  state.aiStyle=pick==='random'?ks[Math.floor(Math.random()*ks.length)]:pick;state.aiSecret=pick==='random';
  log('戦闘開始　青軍'+sideMen('blue')+'人、赤軍'+sideMen('red')+'人','sys');
  log(timeLabel()+'　青軍の手番','sys');startSide('blue');render();beginSide('blue');
}
/* ---- 配置 ---- */
const DEF_F={blue:0,red:3}; // 青は右、赤は左を向く
function makeUnit(id,side,type,q,r,f,men,ra,rd){
  const men0=Math.max(1,Math.round(men||cfg.units[type].men)),rankA0=Number.isInteger(ra)?ra:1,rankD0=Number.isInteger(rd)?rd:1;
  return {id,no:0,side,type,q,r,f:((f|0)%6+6)%6,men0,w:[men0,0,0],hp:men0*3*cfg.units[type].hp,mp:0,attacked:false,dis:0,
    rankA0,rankD0,expA:cfg.ranks[rankA0].exp,expD:cfg.ranks[rankD0].exp, // 練度（攻撃・守備の最初の段階と経験。戦闘中は変わらない）
    st:{killA:0,killD:0,dead:0,wounded:0,deserted:0}, // この戦闘の記録：攻めて倒した・守って倒した敵兵、戦死・負傷・脱走
    food:men0*(cfg.units[type].eat??1)*cfg.foodDays*2,cargo:type==='supply'?men0*cfg.supplyCap:0,order:null,supplied:true,starving:false, // 兵糧（1人1食分＝1）、輜重の積み荷、往復の命令
    morale:100,hidden:false,pending:false,sprung:false,mark:null,shotFrom:null,worked:false,exposed:false}; // worked＝工事で手番を終えた（次の手番まで無防備）
  // hidden＝隠蔽中、pending＝手番の終わりに隠れる、sprung＝この隠蔽での奇襲は済んだ、mark＝敵が最後に見た位置、shotFrom＝矢を受けた方向
}
function renumber(units){const n={};units.forEach(u=>{const k=u.side+u.type;u.no=n[k]=(n[k]||0)+1;});}
const sideMen=s=>state.units.filter(u=>u.side===s).reduce((n,u)=>n+u.men0,0);
const formChanged=()=>{renumber(state.units);saveFormation();render();};
// 赤軍をAIに任せているときは、赤軍はマップのとおり（触れない）
const deployable=u=>u.side==='blue'||!aiRed;
function rotateSetup(u,dl){if(!deployable(u))return;u.f=(u.f+dl+6)%6;formChanged();}
function placeSetup(u,q,r){if(!deployable(u)||!inZone(u.side,q,r)||unitAt(q,r)||cavBlocked(u.type,{q,r}))return;u.q=q;u.r=r;formChanged();}
function resetFormation(){delete formation.byMap[state.mapId];try{localStorage.setItem(FORM_STORE,JSON.stringify(formation));}catch(e){}newGame(true);}
function startSide(side){state.units.filter(u=>u.side===side).forEach(u=>{
  u.mp=cfg.units[u.type].mp;u.attacked=false;u.dis=0;u.worked=false;u.exposed=false;
  // 敵と接していなければ負傷兵が少しずつ良くなる。村や自軍の本陣にいれば、さらに手当てが進む
  const f=featOf(u),rate=f?.type==='village'?cfg.villageHeal:f?.type==='honjin'&&f.side===u.side&&!state.taken[u.side]?cfg.honjinHeal:0;
  if(!inContact(u)&&u.w&&(u.w[1]+u.w[2])>0){
    const before=u.w[1]+u.w[2];healSteps(u,before*cfg.woundHealHp/10+rate*u.men0*3); // 1段階＝HP10。負傷兵1人あたり woundHealHp ずつ回復する
    if(rate>0)log(uname(u)+'が'+(f.type==='village'?'村':'本陣')+'で手当てを受けた（軽傷'+Math.round(u.w[1])+'・重傷'+Math.round(u.w[2])+'）','sys',u.side);
  }
});
  regroupTick(side);supplyTick(side);moraleTick(side);
}
/* ---- 略奪と焼き払い（どちらもその部隊の手番を使い、取り消せない） ---- */
// 略奪：占領した敵の本陣か、蓄えのある村で。自分の兵糧（輜重なら積み荷も）を満たし、隣の自軍の輜重にも積む
const stockKey=p=>{const f=featOf(p);if(f?.type==='fort'){const [c,r]=f.fid.split(',').map(Number),o=fromCR(c,r);return key(o.q,o.r);}return key(p.q,p.r);};
const lootSpot=u=>{const f=featOf(u);if(!f||!STOCK_TYPES.includes(f.type)||(f.type==='honjin'&&f.side===u.side))return null;if(STRUCTS.includes(f.type)&&!structType(u))return null;const k=stockKey(u);return (state.stock[k]??0)>0?k:null;};
const lootWord=u=>{const f=featOf(u);return f.type==='honjin'||f.type==='village'?'略奪':'蓄えを運び出す';};
const canAct=u=>state.phase==='battle'&&!state.winner&&u.side===state.side&&!u.attacked&&!u.pending;
const canLoot=u=>canAct(u)&&!!lootSpot(u)&&(u.food<foodMax(u)||(u.type==='supply'&&u.cargo<cargoMax(u))||state.units.some(x=>x.side===u.side&&x.type==='supply'&&dist(x,u)===1&&x.cargo<cargoMax(x)));
function loot(u){
  if(!canLoot(u))return;
  const k=lootSpot(u),f=featOf(u),name=f.type==='honjin'?SIDE_NAME[f.side]+'の本陣':f.type==='village'?'村':structName(u);let got=0;
  const take=n=>{const g=Math.min(Math.max(0,n),state.stock[k]);if(isFinite(state.stock[k]))state.stock[k]-=g;got+=g;return g;};
  u.food+=take(foodMax(u)-u.food);if(u.type==='supply')u.cargo+=take(cargoMax(u)-u.cargo);
  state.units.filter(x=>x.side===u.side&&x.type==='supply'&&x!==u&&dist(x,u)===1).forEach(x=>{x.cargo+=take(cargoMax(x)-x.cargo);});
  u.attacked=true;u.mp=0;state.history=[];if(u.hidden)reveal(u,'略奪して姿を現した');
  log(uname(u)+'が'+name+'で'+lootWord(u)+'（兵糧'+Math.round(got)+'、残り'+(isFinite(state.stock[k])?Math.round(state.stock[k]):'∞')+'）','kill');render();
}
// 兵糧を蓄える：輜重が陣地・砦・村に立って、積み荷をその場所の蓄えに下ろす（前線の補給基地にできる）
const depotOf=u=>{const f=featOf(u);if(!f||!['village','jinchi','fort'].includes(f.type))return null;if(f.type!=='village'&&!structType(u))return null;return stockKey(u);};
const canDeposit=u=>canAct(u)&&u.type==='supply'&&u.cargo>0&&!!depotOf(u);
function deposit(u){
  if(!canDeposit(u))return;
  const k=depotOf(u),n=Math.round(u.cargo),name=featOf(u).type==='village'?'村':structName(u);
  state.stock[k]=(state.stock[k]||0)+n;u.cargo=0;u.attacked=true;u.mp=0;state.history=[];
  log(uname(u)+'が'+name+'に兵糧'+n+'を蓄えた（蓄え'+Math.round(state.stock[k])+'）','sys',privOf(u));render();
}
// 焼き払い：占領した敵の本陣の蓄え、村（蓄えごと焼け跡に）、砦・陣地・柵（壊す）。自軍の本陣は焼かない
function burnTarget(u){
  const f=featOf(u),k=key(u.q,u.r);if(!f)return null;
  if(f.type==='honjin')return f.side!==u.side&&(state.stock[k]??0)>0?SIDE_NAME[f.side]+'の本陣の蓄え':null;
  if(f.type==='village')return '村';
  if(structType(u))return structName(u);
  return null;
}
const canBurn=u=>canAct(u)&&!!burnTarget(u);
function burn(u){
  if(!canBurn(u))return;
  const f=featOf(u),k=key(u.q,u.r),what=burnTarget(u);
  if(f.type==='honjin')state.stock[k]=0;
  else if(f.type==='village'){state.stock[k]=0;featureAt.set(k,{type:'ruin'});}
  else{delete struct[k];if(f.built)featureAt.delete(k);if(state.stock[k])state.stock[k]=0;} // 陣地・砦（中央）の蓄えも焼ける
  u.attacked=true;u.mp=0;state.history=[];if(u.hidden)reveal(u,'火を放って姿を現した');
  log(uname(u)+'が'+what+'を焼き払った','kill');render();
}
/* ---- 時刻：1回の手番の巡りで朝 → 昼 → 夜 → 深夜 → 次の日の朝 ---- */
const SLOTS=['朝','昼','夜','深夜'];
const slotOf=()=>(Math.max(1,state.turn)-1)%4,dayOf=()=>Math.floor((Math.max(1,state.turn)-1)/4)+1;
const isNight=()=>state&&state.phase==='battle'&&slotOf()>=2;
const timeLabel=()=>dayOf()+'日目：'+SLOTS[slotOf()];
/* ---- 兵糧と補給 ---- */
const MEALS=2,mealTime=()=>slotOf()===0||slotOf()===2; // 食事は朝と夜の1日2回、1人1食分＝1
const eatOf=u=>menOf(u)*(cfg.units[u.type].eat??1); // 1食で食べる量（騎兵は馬の分で5倍）
const foodMax=u=>eatOf(u)*cfg.foodDays*MEALS,cargoMax=u=>u.men0*cfg.supplyCap,foodDaysMax=()=>cfg.foodDays-1;
const foodDaysOf=u=>eatOf(u)?Math.floor((u.food??0)/eatOf(u)+1e-9)/MEALS:0; // 残りの兵糧（日分、半日＝1食刻み）
const hqReady=side=>{const hq=honjinOf(side);return hq&&!state.taken[side]&&(state.stock[key(hq.q,hq.r)]??Infinity)>0?hq:null;}; // 占領されておらず、蓄えが残っている本陣
// 手番のはじめ：本陣のそばの輜重は積み込む。積み荷が少ない（supplyReturn 未満）ときの積み込みはその手番を使い、
// 少し減っただけなら継ぎ足すだけで動ける。そのあと本陣と輜重が周りの部隊へ兵糧を配る
function supplyTick(side){
  const us=state.units.filter(u=>u.side===side),hq=hqReady(side);
  us.forEach(u=>{u.supplied=false;});
  const hk=hq&&key(hq.q,hq.r),take=n=>{const g=Math.min(n,state.stock[hk]??Infinity);if(isFinite(state.stock[hk]))state.stock[hk]-=g;return g;}; // 本陣の蓄えから出す
  if(hq)us.filter(u=>u.type==='supply'&&dist(u,hq)<=1&&u.cargo<cargoMax(u)).forEach(u=>{
    const big=u.cargo<cargoMax(u)*cfg.supplyReturn,g=take(cargoMax(u)-u.cargo);if(g<=0)return;u.cargo+=g;if(u.order)u.order.phase='out';
    if(big){u.mp=0;log(uname(u)+'が本陣で積み込み（'+u.cargo+'、この手番は動けない）','sys',u.side);}
  });
  const fill=(u,give)=>{const need=Math.max(0,foodMax(u)-u.food),g=Math.min(need,give);u.food+=g;u.supplied=true;return g;};
  if(hq)us.filter(u=>dist(u,hq)<=cfg.honjinSupplyRange).sort((a,b)=>foodDaysOf(a)-foodDaysOf(b)).forEach(u=>{const need=Math.max(0,foodMax(u)-u.food);if(need>0)u.food+=take(need);if((state.stock[hk]??1)>0||need===0)u.supplied=true;});
  // 輜重は、残りの少ない部隊から順に配る
  us.filter(s=>s.type==='supply'&&s.cargo>0).forEach(s=>{
    us.filter(u=>dist(u,s)<=cfg.supplyRange).sort((a,b)=>foodDaysOf(a)-foodDaysOf(b)).forEach(u=>{if(s.cargo>0)s.cargo-=fill(u,s.cargo);});
  });
}
// 朝と夜の手番の終わりに食事：今いる人数分を食べる。足りなければ兵糧切れで士気が下がる
function eatTick(side){
  if(!mealTime())return;
  state.units.filter(u=>u.side===side).forEach(u=>{
    const eat=eatOf(u);
    if(u.food>=eat){u.food-=eat;u.starving=false;return;}
    u.food=0;u.starving=true;shiftMorale(u,-cfg.hungerMorale);
    log(uname(u)+'は兵糧が尽きて食事を抜いた（士気−'+cfg.hungerMorale+'、士気'+moraleOf(u)+'）','sys',privOf(u));
  });
}
// 補給が届くマス（本陣と、積み荷のある輜重から）
function supplyCells(side,only){
  const out=new Set(),add=(p,r)=>cells.forEach((c,k)=>{if(dist(c,p)<=r)out.add(k);});
  if(only){add(only,cfg.supplyRange);return out;}
  const hq=hqReady(side);if(hq)add(hq,cfg.honjinSupplyRange);
  state.units.forEach(u=>{if(u.side===side&&u.type==='supply'&&u.cargo>0)add(u,cfg.supplyRange);});
  return out;
}
// マスの集まりの外周（隣が集まりの外になっている辺）をつないだパス
function outlinePath(set){
  let d='';
  set.forEach(k=>{const c=cells.get(k);if(!c)return;
    const pts=hexPts(c.x,c.y).split(' ').map(p=>p.split(',').map(Number));
    for(let i=0;i<6;i++){
      const n=key(c.q+DIRS[i][0],c.r+DIRS[i][1]);if(set.has(n))continue;
      const o=toScreen(DIRS[i][0],DIRS[i][1]),mx=c.x+o.x/2,my=c.y+o.y/2; // 辺の中点に近い2つの角がその辺
      const [a,b]=pts.map(p=>({p,d:Math.hypot(p[0]-mx,p[1]-my)})).sort((x,y)=>x.d-y.d);
      d+='M'+a.p[0]+','+a.p[1]+'L'+b.p[0]+','+b.p[1];
    }
  });
  return d;
}
// 往復の行き先（部隊が行き先なら、その部隊の今の位置）
function orderGoal(u){
  const o=u.order;if(!o)return null;
  if(o.phase==='back')return hqReady(u.side);
  if(o.unit!=null){const t=byId(o.unit);return t&&t.side===u.side?{q:t.q,r:t.r}:null;}
  return {q:o.q,r:o.r};
}
// 行き先の隣まで、移動力の合計がいちばん少ない道（旋回も含む）。知っている部隊のマスと敵のZOCは通らない
function pathTo(u,goal,reach=1){
  const blocked=new Set(state.units.filter(o=>o!==u&&(o.side===u.side||spotted(o,u.side))).map(o=>key(o.q,o.r)));
  const sk=s=>s.q+','+s.r+','+s.f,start={q:u.q,r:u.r,f:u.f,type:u.type,side:u.side,hid:u.hidden,c:0,prev:null,act:null},best=new Map([[sk(start),start]]),queue=[start];
  while(queue.length){
    let bi=0;for(let i=1;i<queue.length;i++)if(queue[i].c<queue[bi].c)bi=i;
    const s=queue.splice(bi,1)[0];if(best.get(sk(s))!==s)continue;
    if(dist(s,goal)<=reach){const acts=[];for(let x=s;x.prev;x=x.prev)acts.unshift(x.act);return acts;}
    const push=n=>{const k=sk(n),o=best.get(k);if(!o||o.c>n.c){best.set(k,n);queue.push(n);}};
    [-1,1,3].forEach(dl=>push({...s,f:(s.f+dl+6)%6,c:s.c+turnCostOf(u,dl,false),prev:s,act:{t:'turn',dl}}));
    for(let d=0;d<6;d++){
      const nq=s.q+DIRS[d][0],nr=s.r+DIRS[d][1],k=key(nq,nr);
      if(!cells.has(k)||blocked.has(k)||(inZoc(nq,nr,u.side)&&dist({q:nq,r:nr},goal)>reach))continue;
      const c=moveCost(s,d);if(!isFinite(c))continue;
      const rel=(d-s.f+6)%6;push({...s,q:nq,r:nr,f:(rel===1||rel===5)?d:s.f,c:s.c+c,prev:s,act:{t:'move',d}});
    }
  }
  return null;
}
// AIの輜重：兵糧の残りが少ない味方（同じなら本陣から遠い前線）へ往復する。知っている敵が2マス以内なら本陣へ下がる
function aiSupplyOrders(side){
  const hq=honjinOf(side),foes=state.units.filter(e=>e.side!==side&&e.type!=='supply'&&spotted(e,side));
  const need=state.units.filter(u=>u.side===side&&u.type!=='supply').sort((a,b)=>foodDaysOf(a)-foodDaysOf(b)||(hq?dist(b,hq)-dist(a,hq):0))[0];
  state.units.filter(u=>u.side===side&&u.type==='supply').forEach(u=>{
    if(!need){u.order=null;return;}
    if(!u.order)u.order={unit:need.id,phase:u.cargo<cargoMax(u)*cfg.supplyReturn?'back':'out'};else u.order.unit=need.id;
    if(hqReady(side)&&nearestDist(u,foes)<=2&&u.order.phase!=='back'){u.order.phase='back';log(uname(u)+'は敵が近いので本陣へ下がる','sys',side);}
  });
}
let autoMoving=false; // 輜重の自動の往復中（手で動かしたときだけ命令を解除する）
// 手番のはじめ：往復を命じられた輜重が自動で動く。積み荷が減ったら本陣へ戻る
async function autoSupply(side){
  if(isAI(side))aiSupplyOrders(side);
  const list=state.units.filter(u=>u.side===side&&u.type==='supply'&&u.order);if(!list.length)return;
  const g=gen;busy=true;autoMoving=true;
  try{
    for(const u of list){if(g!==gen||state.winner)break;await shuttleStep(u,g);}
  }finally{autoMoving=false;if(g===gen){busy=false;state.selected=null;}}
}
// 往復を命じられた輜重1部隊を、残りの移動力で行き先（または本陣）へ進める
async function shuttleStep(u,g){
  if(!state.units.includes(u)||!u.order||u.mp<=0)return;
  if(u.order.phase!=='back'&&u.cargo<cargoMax(u)*cfg.supplyReturn&&hqReady(u.side)){u.order.phase='back';log(uname(u)+'は積み荷が減ったので本陣へ戻る','sys',u.side);}
  const goal=orderGoal(u);
  if(!goal){if(u.order.unit!=null&&u.order.phase!=='back'){log(uname(u)+'の行き先の部隊がいなくなった（往復を解除）','sys',u.side);u.order=null;}return;}
  // 部隊が行き先なら、その部隊の真横ではなく配れる範囲の少し手前で止まる（前線に出すぎない）
  const reach=u.order.phase!=='back'&&u.order.unit!=null?Math.max(1,cfg.supplyRange-1):1;
  if(dist(u,goal)<=reach)return; // 着いている（本陣なら次の手番のはじめに積み込む）
  const acts=pathTo(u,goal,reach);
  if(!acts){log(uname(u)+'の道がふさがれている','sys',u.side);return;}
  const was=autoMoving;autoMoving=true;state.selected=u.id;
  try{
    for(const a of acts){
      if(g!==gen||!state.units.includes(u))break;
      const q=u.q,r=u.r,f=u.f,pm=state.march;
      if(a.t==='move'){state.march=u.hidden&&onCover({q:u.q+DIRS[a.d][0],r:u.r+DIRS[a.d][1]})?'hidden':'normal';await tryMove(u,a.d);state.march=pm;}else tryTurn(u,a.dl);
      if(u.q===q&&u.r===r&&u.f===f)break; // 移動力が足りない、または止められた
      render();await sleep(140);
    }
  }finally{autoMoving=was;}
}
// 往復を命じたら、その手番の残りの移動力ですぐ動き出す
async function startShuttle(u){
  if(busy||!u.order||u.mp<=0)return;
  const g=gen;busy=true;
  try{await shuttleStep(u,g);}finally{if(g===gen)busy=false;render();}
}
// 手番の始まり（補給の自動の動きを済ませてから、AIの手番なら考えはじめる）
async function beginSide(side){
  await autoSupply(side);state.history=[];render(); // 自動で動いた分は取り消せない
  if(!state.winner&&isAI(side)&&state.side===side)setTimeout(runAI,350);
}
/* ---- 練度 ---- */
// 攻撃の練度・守備の練度（数値調整の値から）。steady＝接敵中の旋回・入れ替えで乱れない
const rankStats=e=>{const i=rankOfExp(e??cfg.ranks[1].exp),r=cfg.ranks[i];return {i,mul:r.mul,morale:r.morale,steady:i+1>=cfg.steadyStars};};
const RA=u=>rankStats(u.expA),RD=u=>rankStats(u.expD);
// 損害の記録：失った兵は負傷と戦死に分け、倒した側には「攻めて」か「守って」倒した数として数える（経験は戦闘の終わりにまとめて入る）
// r＝applyDamage の結果。死傷させた数を「攻めて」か「守って」倒した数として数える
function casualty(t,r,by,mode){
  if(!r||!(r.affected>0))return;
  const st=t.st||(t.st={killA:0,killD:0,dead:0,wounded:0,deserted:0});
  st.dead+=r.dead;
  if(by){const b=by.st||(by.st={killA:0,killD:0,dead:0,wounded:0,deserted:0});b[mode==='def'?'killD':'killA']+=r.affected;b[mode==='def'?'ptsD':'ptsA']=(b[mode==='def'?'ptsD':'ptsA']||0)+r.pts;}
}
/* ---- 士気 ---- */
const moraleOf=u=>Math.round(u.morale??100);
function shiftMorale(u,d){u.morale=Math.min(100,Math.max(0,(u.morale??100)+d));}
// 損害を受けたときの動揺。heavy＝側面・背後・奇襲など
function shaken(u,lost,heavy){if(!state.units.includes(u))return;shiftMorale(u,-(lost/u.men0*100*cfg.lossMorale+(heavy?cfg.flankMorale:0))*RD(u).morale);} // 守備の練度が高いほど動じにくい
// 手番のはじめ：本陣を占領されている間は下がり、敵と接していなければ回復し、士気が低いと脱走が出る
function moraleTick(side){
  const us=state.units.filter(u=>u.side===side);
  if(state.taken[side]&&cfg.honjinOccupiedMorale>0){us.forEach(u=>shiftMorale(u,-cfg.honjinOccupiedMorale));log(SIDE_NAME[side]+'の本陣は占領されたまま（士気−'+cfg.honjinOccupiedMorale+'）','sys',side);}
  us.forEach(u=>{
    // 脱走は今の士気で決まり、そのあとで回復する
    const m=u.morale??100,men=menOf(u),lost=m<cfg.desertLine?Math.round(men*(cfg.desertLine-m)/cfg.desertLine*cfg.desertMax):0;
    if(lost>=1){
      removeMen(u,lost);(u.st||(u.st={killA:0,killD:0,dead:0,wounded:0,deserted:0})).deserted+=lost;
      if(menOf(u)<=0){state.units=state.units.filter(x=>x!==u);state.gone.push(u);log(uname(u)+'は士気が尽き、残る兵も逃げ散った','kill',privOf(u));return;}
      log(uname(u)+'から'+lost+'人が脱走（士気'+moraleOf(u)+'、残り'+menOf(u)+'人）','sys',privOf(u));
    }
    if(u.supplied&&!inContact(u))shiftMorale(u,cfg.moraleRecover); // 補給が届き、敵と接していなければ回復
  });
  checkWinner();
}
/* ---- 退却：盤面から消え、2日後（8回の時間帯のあと）に本陣で再編されて戻る ----
   戻る兵数は退却したときの兵数×士気％（健常・軽傷・重傷の割合はそのまま）、戻ったときの士気は元の士気の二乗（50→25）。
   本陣を占領されている（または本陣がない）と使えない */
const RETREAT_TURNS=8;
const retreatBlock=u=>{const hq=honjinOf(u.side);return !hq?'本陣がないので退却できません':state.taken[u.side]?'本陣が占領されているので退却できません。本陣を取り返してください':'';};
const canRetreat=u=>state.phase==='battle'&&!state.winner&&u.side===state.side&&!u.attacked&&!u.pending&&u.mp>=cfg.units[u.type].mp;
function retreat(u){
  if(!canRetreat(u)||retreatBlock(u))return;
  const m=u.morale??100,k=m/100,[F,L,Hh]=wOf(u),men=menOf(u),back=Math.round((F+L+Hh)*k);
  state.units=state.units.filter(x=>x!==u);state.history=[];state.selected=null;
  u.hidden=false;u.pending=false;u.order=null;
  state.retreating.push({u,due:state.turn+RETREAT_TURNS,w:[F*k,L*k,Hh*k],morale:m*m/100});
  log(uname(u)+'が退却した（'+men+'人。士気'+Math.round(m)+'なので、およそ'+back+'人が2日後に本陣で再編される）','kill',u.side);
  checkWinner();render();
}
// 手番のはじめ：期日が来た部隊を、本陣のマス（ふさがっていれば周りの空いたマス）に戻す
function regroupTick(side){
  state.retreating.filter(x=>x.u.side===side&&state.turn>=x.due).forEach(x=>{
    const hq=honjinOf(side);if(!hq||state.taken[side])return; // 本陣が占領されていれば、取り返すまで待つ
    const spots=[hq,...DIRS.map(([dq,dr])=>({q:hq.q+dq,r:hq.r+dr})).sort(()=>Math.random()-0.5)].filter(p=>cells.has(key(p.q,p.r))&&!unitAt(p.q,p.r)&&!cavBlocked(x.u.type,p));
    if(!spots.length)return;
    const u=x.u;state.retreating=state.retreating.filter(y=>y!==x);
    u.q=spots[0].q;u.r=spots[0].r;u.f=DEF_F[side];u.w=x.w;syncHp(u);u.morale=x.morale;u.dis=0;u.exposed=false;
    if(menOf(u)<=0){log(uname(u)+'は再編できる兵が残らなかった','kill',side);state.gone.push(u);return;}
    state.units.push(u);
    log(uname(u)+'が本陣で再編された（'+menOf(u)+'人、士気'+moraleOf(u)+'）','kill',side);
  });
}
/* ---- 兵の状態：健常・軽傷・重傷（u.w＝[健常, 軽傷, 重傷] の人数） ----
   兵士1人のHPは、健常30・軽傷20・重傷10（1段階＝兵種の「1人あたりのHP」）。u.hp は残りのHPの合計（攻撃の見込みや全滅の判定に使う） */
const STEP=u=>cfg.units[u.type].hp;
const maxHp=u=>u.men0*3*STEP(u);
const wOf=u=>u.w||[Math.max(0,u.hp/STEP(u)/3),0,0];
const syncHp=u=>{const [F,L,H]=u.w;u.hp=(3*F+2*L+H)*STEP(u);};
const menOf=u=>{const [F,L,H]=wOf(u),n=F+L+H;return n<0.5?0:Math.round(n);}; // 生きている兵（負傷も含む）
const effMen=u=>{const [F,L,H]=wOf(u);return F+L*cfg.lightEff+H*cfg.heavyEff;}; // 戦う力（軽傷・重傷は弱い）
// 打撃を割り振った結果（部隊は変えない）。健常の兵から軽傷・重傷・死亡の割合で、余れば軽傷→重傷・死亡、重傷→死亡と進める
function simDamage(u,dmg){
  let [F,L,H]=wOf(u),S=Math.max(0,dmg)/STEP(u),dead=0,toL=0,toH=0;
  const l=cfg.woundLight,h=cfg.woundHeavy,d=cfg.woundDead,perA=l+2*h+3*d;
  const A=Math.min(F,S/perA);F-=A;L+=A*l;H+=A*h;dead+=A*d;toL+=A*l;toH+=A*h;S-=A*perA;
  const hl=h+d?h/(h+d):1,perB=hl+2*(1-hl),B=S>0?Math.min(L,S/perB):0;L-=B;H+=B*hl;dead+=B*(1-hl);toH+=B*hl;S-=B*perB;
  const C=S>0?Math.min(H,S):0;H-=C;dead+=C;
  return {w:[F,L,H],dead,toL,toH,affected:A+B+C,pts:A*perA+B*perB+C}; // pts＝削った段階の数（軽傷1・重傷2・死亡3）
}
function applyDamage(u,dmg){const r=simDamage(u,dmg);u.w=r.w;syncHp(u);return r;}
const lossOf=(u,dmg)=>Math.round(simDamage(u,dmg).affected); // 打撃で死傷する人数
// 負傷兵を steps 段階ぶん良くする（重傷→軽傷を先に、次に軽傷→健常）
function healSteps(u,steps){let [F,L,H]=wOf(u);const x=Math.min(H,steps);H-=x;L+=x;steps-=x;const y=Math.min(L,steps);L-=y;F+=y;u.w=[F,L,H];syncHp(u);}
// 兵が抜ける（脱走）：健常・軽傷・重傷から人数の割合で
function removeMen(u,n){const [F,L,H]=wOf(u),t=F+L+H||1,k=Math.max(0,1-n/t);u.w=[F*k,L*k,H*k];syncHp(u);}
const lossText=r=>'死傷'+Math.round(r.affected)+'人（うち死亡'+Math.round(r.dead)+'）';
const unitAt=(q,r)=>state.units.find(u=>u.q===q&&u.r===r);
// 画面を見ている側（決着後は全員見える）。AIが赤軍なら配置中も含めて常に青軍の視点
function viewer(){
  if(state.winner)return null;
  if(state.phase!=='battle')return aiRed?'blue':null;
  if(state.prompt){const h=byId(state.prompt.h);if(h)return h.side;}
  return aiRed?'blue':state.side;
}
/* ---- 視界（索敵） ---- */
// 前方（攻撃できる向き、左右90°まで）は visFront マス、それ以外は visRear マス先まで見える。丘・山の上なら visHigh マス伸びる
// 森・丘・山は視線をさえぎる（丘・山の上からは森・丘越しに見える）。森の中は隣のマスからしか見えない
const other=s=>s==='blue'?'red':'blue';
function hexLine(a,b){ // a と b の間のマス（両端を除く）。境目をかすめる線は、さえぎられにくい側を取る

function tryMove(u,d){

    state.history=[];u.mp=0;
    log('遭遇！ '+uname(u)+'が'+(o.hidden?'隠れていた':'暗闇で見えていなかった')+uname(o)+'とぶつかった','kill');
    if(u.hidden)reveal(u,'ぶつかって姿を現した'); // ぶつかった以上、お互いに位置が分かる
    if(!o.hidden){ // 暗闇で見えていなかった敵：両方とも隊列が乱れる
      o.exposed=true;setDis(u,1);setDis(o,1);log('　暗闇でのぶつかり合いで、両方の隊列が乱れた','sys');

  log(uname(a)+' → '+name+'：'+dmg+'の損傷'+(s.hp>0?'（残り'+s.hp+'／'+maxOf(t)+'）':''));

}
// 槍兵の工事：動く前なら、柵も陣地も部隊の前方のマスに、兵数に応じた耐久を積む（行動は終わる）。前方から囲めば、何部隊でも同じ陣地に積める
// 作りかけ・壊れかけの柵や陣地にも続けて積める（修理）。砦は新しく築けないが、立っている砦のマスは修理できる。10人で1、100人で10（buildRate＝0.1）
const workRate=u=>Math.floor(effMen(u)*cfg.buildRate+1e-9); // 小数点以下は切り捨て
function workSpot(u,type){const p={q:u.q+DIRS[u.f][0],r:u.r+DIRS[u.f][1]};return cells.has(key(p.q,p.r))?p:null;}
// 実際に工事する種類（陣地のボタンでも、砦のマスなら砦の修理）
const workType=(p,type)=>{const f=featOf(p);return f&&type==='jinchi'&&f.type==='fort'?'fort':type;};
function canWork(u,type){
  if(state.phase!=='battle'||state.winner||u.side!==state.side||u.type!=='spear'||u.attacked||u.pending||u.mp<cfg.units.spear.mp||inContact(u)||workRate(u)<1)return false;
  const p=workSpot(u,type);if(!p)return false;
  const f=featOf(p),t=workType(p,type);if(f&&f.type!==t)return false;
  if(t==='fort'&&!struct[key(p.q,p.r)])return false; // 壊れた砦は建て直せない
  const o=unitAt(p.q,p.r);if(['mountain','river'].includes(terOf(p))||(o&&(type==='fence'||o.side!==u.side)))return false; // 柵は空きマスだけ。陣地・砦は味方がいても工事できる
  const s=struct[key(p.q,p.r)];return !s||s.hp<maxOf(t);
}
function work(u,type){

  pushHistory();
  const p=workSpot(u,type),k=key(p.q,p.r);type=workType(p,type);const max=maxOf(type);
  if(!featureAt.get(k))featureAt.set(k,{type,built:true,side:u.side}); // 作った軍のもの（自軍では壊せない）
  const name=structName(p);

}

/* ---- 戦闘の終わり：経験をまとめる（単発の戦闘では表示だけ。キャンペーンで引き継ぐ） ---- */

  const all=[...state.units,...state.retreating.map(x=>x.u),...state.gone.filter(u=>!state.units.includes(u))].filter((u,i,a)=>a.indexOf(u)===i);
  state.result=all.map(u=>{

    const bonus=alive?(win?cfg.expWin:cfg.expLose):0,[F,L,H]=wOf(u);

    const gA=alive?(st.ptsA||0)/(3*u.men0)*100+bonus:0,gD=alive?(st.ptsD||0)/(3*u.men0)*100+bonus:0;

// 奇襲をまだ使っていない隠れた部隊の攻撃範囲に敵が入ったら、奇襲するか見送るかを選ぶ
async function reactions(m){
  const hs=state.units.filter(h=>h.side!==m.side&&surprise(h)&&canStrike(h,m)&&spotted(m,h.side));
  for(const h of hs){
    if(state.winner||!state.units.includes(m)||!state.units.includes(h)||!surprise(h)||!canStrike(h,m))continue;

function tryTurn(u,delta){

  if(Math.abs(delta)===3&&pinned(u))return; // 敵のZOCの中では60度の旋回1回だけ（回れ右は旋回3回分なのでできない）
  const contact=pinned(u),cost=turnCostOf(u,delta,contact); // 敵のZOCの中でだけ、旋回が高くつき隊列が乱れる（敵の横や背後に接しているだけなら普段どおり。隠れている部隊も普段どおり）

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// 1部隊の計画。1マスごとに隠蔽行軍（隠れ場所の中だけ、遅い）か通常行軍（速いが隠蔽が解ける）を選び、

  const pct=(n,x)=>n*100/(maxHp(x)/3); // 損害を「兵1人分のHP（1段階）×兵数」に対する割合で見る（負傷の3段階を入れる前と同じ尺度）

  // 伏兵の攻撃は奇襲の倍率がかかり、反撃を受けない。隠れ直すなら攻撃はしない
  if(!hideEnd)enemies.forEach(t=>{if(canAttack(V,t)){const r=computeAttack(V,t,surprise(V)),k=r.dmg>=t.hp,c=k||t.worked||V.hidden?null:computeCounter(V,t,r.dmg);
    let v=(pct(Math.min(r.dmg,t.hp),t)+(k?35:0))*W.atk;
    if(t.type==='supply')v+=(20+(k?20:0))*W.raid; // 敵の輜重を断つ
    if(surprise(V)||r.cat==='斜め後ろ'||r.cat==='真後ろ')v+=8*W.atk; // 側面・背後・奇襲は士気も大きく削る
    if(c)v-=(pct(Math.min(c.dmg,u.hp),u)+(c.dmg>=u.hp?35:0))*W.counter;if(v>atkVal){atkVal=v;target=t;kills=k;}}});
  // 隠れて手番を終えるなら、狙われる危険は小さい（近接で攻撃すると姿を現す）
  const concealed=hideEnd||(s.hid&&!(target&&!(u.type==='archer'&&dist(V,target)>=2)));
  let threat=0;
  enemies.forEach(e=>{
    if(kills&&e===target||e.type==='supply')return;
    const E=cfg.units[e.type],d=dist(e,V);if(d>E.mp+E.rmax)return;
    const r=computeAttack({q:e.q,r:e.r,f:e.f,type:e.type,hp:e.hp,w:e.w,dis:0,side:e.side,attacked:false},V);
    let dm=r.dm,dmg=pct(r.dmg,u);
    if(e.type==='cav'&&d>=2&&dm<cfg.side){dmg=dmg*cfg.side/dm;dm=cfg.side;} // 騎兵は回り込んでくると想定
    const front=dmg/dm;threat+=front*0.12+(dmg-front)*0.6;
  });

  let stealth=0;
  if(s.seen)stealth-=12; // 隠れていたのに、見られていそうなところで姿をさらした
  if(hideEnd&&!s.hid&&est.has(key(s.q,s.r)))stealth-=6; // 見られながら隠れると、隠れた場所を知られる
  if(concealed&&lure.some(e=>dist(e,V)<=4))stealth+=6; // 敵の近くで隠れて待つ
  // 見えている敵がいなければ、最後に見た位置、それもなければ敵の本陣へ向かう
  const goals=enemies.length?enemies:Object.values(state.memo[u.side]||{}).concat(honjinOf(other(u.side))||[]);
  const near=goals.length?nearestDist(V,goals):0;
  let pos=(u.type==='archer'?-Math.abs(near-3)*3-(near===1?10:0):-near*3)*W.near/3;
  const hq=honjinOf(other(u.side));
  if(hq){if(V.q===hq.q&&V.r===hq.r)pos+=state.taken[other(u.side)]?20:80;else if(u.type!=='archer')pos-=dist(V,hq)*W.hq;} // 敵の本陣を目指す
  // 補給：範囲の外に出るのは損。ただし兵糧に余裕がある（3日分以上）間はほとんど気にせず前に出る
  const ft=foodDaysOf(u);let sup=0;

  if(ft<foodDaysMax()){const spots=[...state.stock?Object.keys(state.stock):[]].filter(k=>state.stock[k]>0).map(k=>{const [q,r]=k.split(',').map(Number);return {q,r};}).filter(p=>lootSpot({...p,side:u.side}));
    if(spots.length)sup+=(lootSpot({...V,side:u.side})?(cfg.foodDays-ft)*12:-nearestDist(V,spots)*(cfg.foodDays-ft)*1.5);}
  if(!ctx.sup.has(key(V.q,V.r)))sup-=ft>=3?0.5:(4+(3-ft)*6)*(u.starving?2:1);
  // 士気が低く脱走が出る部隊は前に出ず、補給か本陣のほうへ下がって立て直す
  if(mor<cfg.desertLine){pos*=0.3;const home=[...state.units.filter(x=>x.side===u.side&&x.type==='supply'&&x.cargo>0),...(hqReady(u.side)?[hqReady(u.side)]:[])];if(home.length)pos-=nearestDist(V,home)*3;}
  // 自軍の本陣：占領されたら奪い返しに戻る。敵が近づいていれば守りに入る（本陣の近くにいる部隊だけ。遠くの部隊は前線に残る）
  const myHq=honjinOf(u.side);let def=0;
  if(myHq&&u.type!=='supply'&&dist(u,myHq)<=6){
    if(state.taken[u.side])def+=(V.q===myHq.q&&V.r===myHq.r?150:0)-dist(V,myHq)*2;
    else{const danger=Math.max(0,5-nearestDist(myHq,enemies.filter(e=>e.type!=='supply')));if(danger)def+=(dist(V,myHq)<=2?danger*8:0)-danger*dist(V,myHq);}
  }
  return {score:atkVal-threat*W.threat+stealth*W.stealth+pos+groundVal(V,u.side)*W.ground+sup*W.supply+def*W.hqDef,target:hideEnd?null:target,hide:hideEnd};
}
function aiWantsAmbush(h,m){
  const r=computeAttack(h,m,true);
  return r.dmg>=m.hp||r.cat==='斜め後ろ'||r.cat==='真後ろ'||lossOf(m,r.dmg)>=Math.max(1,menOf(m)*0.25); // 大きく削れるときだけ奇襲し、あとは見送る
}
async function runAI(){
  const side=state.side;
  if(busy||state.winner||!isAI(side)||state.phase!=='battle')return;
  busy=true;const g=gen;
  const enemies=()=>state.units.filter(e=>e.side!==side&&spotted(e,side));
  const order=state.units.filter(u=>u.side===side&&u.type!=='supply').sort((a,b)=>nearestDist(a,enemies())-nearestDist(b,enemies()));
  for(const u of order){
    if(g!==gen||state.winner)break;
    if(!state.units.includes(u))continue;
    let plan=planFor(u);state.selected=u.id;render();await sleep(220);
    // 途中で新しく敵を見つけたら、そこで考え直す（3回まで）
    for(let round=0;round<3;round++){
      let again=false;
      for(const a of plan.acts){if(g!==gen||!state.units.includes(u)||state.winner)break;
        const n=enemies().length,q=u.q,r=u.r,f=u.f,pm=state.march;
        if(a.t==='move'){state.march=a.hide?'hidden':'normal';await tryMove(u,a.d);state.march=pm;}else tryTurn(u,a.dl);
        await sleep(140);
        if(u.q===q&&u.r===r&&u.f===f){again=true;break;} // 動けなかった（見えていなかった部隊にぶつかった等）
        if(enemies().length>n){again=true;break;}
      }
      if(!again||g!==gen||!state.units.includes(u)||state.winner||u.mp<=0)break;
      plan=planFor(u);
    }
    if(g!==gen)break;
    if(!state.units.includes(u))continue;
    if(state.winner)break;
    if(plan.hide){if(canHide(u))hideUnit(u);await sleep(220);}
    else if(plan.target&&state.units.includes(plan.target)&&canAttack(u,plan.target)){doAttack(u,plan.target);await sleep(380);}
    else if(canLoot(u)){loot(u);await sleep(300);}
    // 敵の本陣の蓄えは自軍の補給庫として残し、奪い返されそうなとき（知っている敵が3マス以内）だけ焼く
    else if(canBurn(u)&&featOf(u)?.type==='honjin'&&state.units.some(e=>e.side!==u.side&&e.type!=='supply'&&spotted(e,u.side)&&dist(e,u)<=3)){burn(u);await sleep(300);}
    else{
      const f=[...cells.values()].find(c=>canHitStruct(u,c)&&fenceAt(c)&&cfg.fenceVs[u.type]>=1); // 行く手の柵は、壊しやすい兵種で壊す
      if(f){attackStruct(u,f);await sleep(380);}
    }
  }
  if(g!==gen)return;
  busy=false;state.selected=null;
  if(!state.winner)endTurn();else render();
}
function undo(){
  if(busy||state.prompt)return;
  const s=state.history.pop();if(!s)return;
  const o=JSON.parse(s);state.units=o.units;struct=o.struct||{};state.log.length=o.logLen;state.winner=o.winner;if(!o.winner)state.result=null;state.taken=o.taken||{blue:false,red:false};state.gone=o.gone||[];
  featureAt.forEach((f,k)=>{if(f.built&&!(k in struct))featureAt.delete(k);}); // 取り消した工事
  if(state.selected!=null&&!byId(state.selected))state.selected=null;render();
}

svg.addEventListener('click',e=>{
  if(busy||state.prompt)return;
  const el=e.target.closest('[data-key]');if(!el)return;
  const [q,r]=el.dataset.key.split(',').map(Number);
  const sel=state.selected!=null?byId(state.selected):null;
  const u=seenAt(q,r);
  if(state.swap!=null){ // 入れ替えの相手
    const a=byId(state.swap),b=unitAt(q,r);state.swap=null;
    if(a&&b&&canSwap(a,b))doSwap(a,b);else render();
    return;
  }
  if(state.pick!=null){ // 輜重の往復の行き先
    const s=byId(state.pick);state.pick=null;
    if(s&&s.side===state.side&&state.phase==='battle'){
      if(u&&u.side===s.side&&u!==s&&u.type!=='supply'){s.order={unit:u.id,phase:'out'};log(uname(s)+'に'+uname(u)+'への往復を命じた','sys',s.side);}
      else if(!(u&&u===s)){s.order={q,r,phase:'out'};log(uname(s)+'に往復を命じた（行き先のマスへ）','sys',s.side);}
      if(s.order){render();startShuttle(s);return;}
    }
    render();return;
  }
  const canU=sel&&sel.side===state.side&&u&&u.side!==sel.side&&canAttack(sel,u);
  const canS=state.phase==='battle'&&sel&&sel.side===state.side&&canHitStruct(sel,{q,r});
  state.choice=null;
  if(canU&&canS){state.choice={q,r};render();return;} // 部隊を攻撃するか、拠点を攻撃するか
  if(canU){doAttack(sel,u);return;}
  if(canS){attackStruct(sel,{q,r});return;}
  if(state.phase==='setup'){
    if(u)state.selected=u.id;else if(sel&&inZone(sel.side,q,r)){placeSetup(sel,q,r);return;}else state.selected=null;
    render();return;
  }
  if(u){state.selected=u.id;render();return;}
  if(sel&&sel.side===state.side&&dist(sel,{q,r})===1){
    const d=DIRS.findIndex(v=>sel.q+v[0]===q&&sel.r+v[1]===r);if(d>=0){tryMove(sel,d);return;}
  }
  state.selected=null;render();
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||busy||state.prompt)return;
  const sel=state.selected!=null?byId(state.selected):null;
  const turn=dl=>{if(!sel)return;if(state.phase==='setup')rotateSetup(sel,dl);else tryTurn(sel,dl);};
  if(e.key==='r'||e.key==='R'){turn(3);return;}
  if(e.key==='q'||e.key==='Q')turn(-1);
  else if(e.key==='e'||e.key==='E')turn(1);
  else if(e.key==='z'||e.key==='Z'){undo();}
  else if((e.key==='h'||e.key==='H')&&sel&&state.phase==='battle')hideUnit(sel);
  else if((e.key==='b'||e.key==='B')&&sel)work(sel,'fence');
  else if((e.key==='f'||e.key==='F')&&sel)work(sel,'jinchi');
  else if((e.key==='l'||e.key==='L')&&sel)loot(sel);
  else if((e.key==='m'||e.key==='M')&&sel&&sel.hidden){state.march=state.march==='normal'?'hidden':'normal';render();}
  else if(e.key==='Enter'){endTurn();}
  else if((e.key==='x'||e.key==='X')&&sel&&state.phase==='battle'){state.swap=state.swap===sel.id||!swapTargets(sel).length?null:sel.id;render();}
  else if(e.key==='Escape'){if(state.swap!=null)state.swap=null;else if(state.pick!=null)state.pick=null;else if(state.choice)state.choice=null;else state.selected=null;render();}
});

/* ---- 数値調整タブから届いた値を反映 ---- */
function applyCfg(c){
  const next=cfgFrom(c);if(JSON.stringify(next)===JSON.stringify(cfg))return; // 同じ値が2通り（メッセージと保存）で届いても1回だけ
  cfg=next;
  state.units.forEach(u=>{if(state.phase==='setup')u.w=[u.men0,0,0];if(u.w)syncHp(u);}); // 1人あたりのHPが変わったら、残りのHPを数え直す
  log('数値調整を反映しました','sys');render();
}
window.addEventListener('message',e=>{if(e.data&&e.data.type===CFG_MSG)applyCfg(e.data.cfg);});
window.addEventListener('storage',e=>{if(e.key===STORE&&e.newValue){try{applyCfg(JSON.parse(e.newValue));}catch(err){}}});
function openMaps(){const w=window.open('hex-maps.html','hex-maps');if(w)w.focus();}
function selectMap(id){const db=loadMaps();if(!db.maps.some(m=>m.id===id))return;db.current=id;saveMaps(db);mapChanged();}
// 配置中ならすぐ切り替え、戦闘中なら次の戦闘から
function mapChanged(){
  const db=loadMaps(),m=findMap(db,db.current);
  if(state.phase==='setup'){newGame(true);return;}
  if(m.id!==state.mapId&&state.nextMap!==m.id){state.nextMap=m.id;log('マップ「'+m.name+'」は次の戦闘から使われます','sys');render();}
}
window.addEventListener('message',e=>{if(e.data&&e.data.type===MAP_MSG)mapChanged();});
window.addEventListener('storage',e=>{if(e.key===MAPS_STORE)mapChanged();});
function openManual(){const w=window.open('hex-manual.html','hex-manual');if(w)w.focus();}
function openSettings(){const w=window.open('hex-settings.html','hex-settings');if(w)w.focus();}

newGame();
</script>
